# Dev-only gateway stub.
#
# Alfa-Kilo owns the real API Gateway. This stub stands in during
# CP#2 integration testing when the gateway container isn't running
# yet: it accepts the same /api/** prefix the frontend calls, strips
# the /api prefix (matching decision 0020 §10), and routes to
# Sten's Restaurant and Menu services on the shared compose
# network. It does NOT implement /api/auth/login -- sign-in in this
# mode requires a dev JWT pasted into localStorage (see runbook §10).
#
# Route order matters: menu-items under a restaurant is listed FIRST
# so nginx's first-match regex lookup routes it to menu-service, not
# restaurant-service.

server {
    listen 80;
    server_name _;

    # Menu items nested under a restaurant -> menu-service.
    location ~ ^/api/restaurants/[^/]+/menu-items {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://menu-service:8082;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        client_max_body_size 2m;
    }

    # Restaurant CRUD / availability -> restaurant-service.
    location ~ ^/api/restaurants {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://restaurant-service:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        client_max_body_size 2m;
    }

    # Standalone menu-item routes + batch validate -> menu-service.
    location ~ ^/api/menu-items {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://menu-service:8082;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        client_max_body_size 2m;
    }

    # Anything else under /api/** lands here. In particular
    # /api/auth/login (User Service) is not wired in this stub.
    location /api/ {
        add_header Content-Type application/json always;
        return 501 '{"error":"Not implemented in dev-gateway","message":"This stub routes only Sten endpoints. Paste a dev JWT into localStorage (key quickbite.jwt) or start Alfa-Kilo\u0027s real gateway.","path":"$request_uri"}';
    }

    # Health probe so compose can gate on this container.
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
