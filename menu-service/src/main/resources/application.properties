spring.application.name=menu-service
server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/menu_db}
spring.datasource.username=${DB_USER:menu_user}
spring.datasource.password=${DB_PASSWORD:menu_pw}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# JWT (used from Phase 7 onward; env-var names stable)
jwt.secret=${JWT_SECRET:dGVzdC1zZWNyZXQtZm9yLWRldi1vbmx5LWRvLW5vdC11c2UtaW4tcHJvZC0xMjM0NTY=}
jwt.issuer=${JWT_ISSUER:quickbite-user-service}

# Restaurant Service base URL for ownership lookups (Phase 15, per
# 0010 auth-contract §8). Dev default hits the host-mapped port.
restaurant-service.base-url=${RESTAURANT_SERVICE_BASE_URL:http://localhost:8081}

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
