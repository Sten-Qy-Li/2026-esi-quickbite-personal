# Overrides applied when SPRING_PROFILES_ACTIVE=docker.
# DB hostname is the container name on the quickbite-net bridge network.
spring.datasource.url=${DB_URL:jdbc:postgresql://menu-db:5432/${MENU_DB_NAME:menu_db}}
spring.datasource.username=${DB_USER:${MENU_DB_USER:menu_user}}
spring.datasource.password=${DB_PASSWORD:${MENU_DB_PASSWORD:menu_pw}}
